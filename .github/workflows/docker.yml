name: docker

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  schedule:
    - cron: "0 4 1 * *"   # monthly rebuild (1st, 04:00 UTC) to pick up Debian security updates
  workflow_dispatch:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -S warning docker-entrypoint.sh scripts/* || true
      - name: build (no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: determine version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="${GITHUB_REF_NAME}"; else v="$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -d' ' -f2)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/itefix/ulaknode:${{ steps.v.outputs.version }}
            ghcr.io/itefix/ulaknode:${{ steps.v.outputs.minor }}
            ghcr.io/itefix/ulaknode:latest
      - name: component versions
        run: |
          for p in linux/amd64 linux/arm64; do
            echo "### ulaknode ${{ steps.v.outputs.version }} ($p)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            docker run --rm --platform "$p" --entrypoint ulaknode-version \
              ghcr.io/itefix/ulaknode:${{ steps.v.outputs.version }} | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
