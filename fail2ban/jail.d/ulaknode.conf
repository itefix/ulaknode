[ulaknode-smtp]
enabled  = true
filter   = ulaknode-smtp
logpath  = /var/log/mail.log
maxretry = 5
findtime = 10m
bantime  = 1h
action   = ulaknode[protocol=smtp]

[ulaknode-imap]
enabled  = true
filter   = ulaknode-imap
logpath  = /var/log/dovecot.log
maxretry = 5
findtime = 10m
bantime  = 1h
action   = ulaknode[protocol=imap]
