# postfix-policyd-spf-python configuration for ulaknode
# Managed as a persistent volume — edit freely, changes survive restarts.
#
# Defaults below respect each sending domain's own published SPF policy:
# hard fail (-all) is rejected, softfail/neutral/none are annotated only via
# the Received-SPF header (which OpenDMARC reads for alignment checks).
# After editing: docker exec ulaknode ulaknode-service restart policyd-spf
# (policyd-spf is spawned per-connection by Postfix, so a Postfix reload
# picks up config changes — there is no long-running daemon to restart).

debugLevel = 1
defaultSeedOnly = 1

HELO_reject = SPF_Not_Pass
Mail_From_reject = Fail

# Local/authenticated traffic never needs an SPF check
skip_addresses = 127.0.0.0/8,::ffff:127.0.0.0/104,::1
