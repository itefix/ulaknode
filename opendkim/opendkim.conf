# OpenDKIM configuration for ulaknode
# Managed as a persistent volume — edit freely, changes survive restarts.
# After editing: docker exec ulaknode ulaknode-service reload opendkim

# Not syslog — this container has no syslog daemon (see docker-init, which
# redirects every service's stdout/stderr straight to its own log file
# instead), so Syslog messages had nowhere to land. With Syslog off,
# opendkim logs to stderr instead, which docker-init already captures to
# opendkim.log/opendkim.err.
Syslog          no
SyslogSuccess   yes
LogWhy          no

UMask           002
UserID          opendkim:opendkim
PidFile         /run/opendkim/opendkim.pid
Socket          local:/run/opendkim/opendkim.sock

# Sign outgoing mail, verify incoming mail
Mode            sv
Canonicalization relaxed/simple

KeyTable            refile:/etc/opendkim/KeyTable
SigningTable        refile:/etc/opendkim/SigningTable

# Hosts/networks whose mail we sign rather than just verify
InternalHosts       refile:/etc/opendkim/TrustedHosts
ExternalIgnoreList  refile:/etc/opendkim/TrustedHosts

OversignHeaders     From
