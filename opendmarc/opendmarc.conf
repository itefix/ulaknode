# OpenDMARC configuration for ulaknode
# Managed as a persistent volume — edit freely, changes survive restarts.
# After editing: docker exec ulaknode ulaknode-service reload opendmarc

# Not syslog — this container has no syslog daemon (see docker-init, which
# redirects every service's stdout/stderr straight to its own log file
# instead), so Syslog messages had nowhere to land. With Syslog off,
# opendmarc logs to stderr instead, which docker-init already captures to
# opendmarc.log/opendmarc.err.
Syslog              false
UMask               0002
UserID              opendmarc:opendmarc
PidFile             /run/opendmarc/opendmarc.pid
Socket              local:/run/opendmarc/opendmarc.sock

# Identity this server signs as in the results it emits/reads
AuthservID          HOSTNAME
TrustedAuthservIDs   HOSTNAME

# Enforce each sending domain's own published p= policy
RejectFailures      true
RequiredHeaders     true

IgnoreHosts         /etc/opendmarc/ignore.hosts
IgnoreAuthenticatedClients true

HistoryFile         /run/opendmarc/opendmarc.dat
