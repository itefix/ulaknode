# ulaknode: dedicated recursive resolver for Postfix (postscreen DNSBL
# lookups, MX/SPF/DKIM lookups on outbound delivery, etc).
#
# Managed as a persistent volume — edit freely, changes survive restarts.
# After editing: docker exec ulaknode ulaknode-service restart unbound
#
# This resolves recursively from the root (no forward-zone), rather than
# forwarding to the host's/provider's resolver. That's the actual point:
# public DNSBLs like Spamhaus classify shared/forwarding resolvers as
# "open" and return their block-page response to every query, which looks
# identical to a real listing. A resolver that only ever serves this one
# mail server avoids that classification.
server:
    interface: 127.0.0.1
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse

    username: "unbound"
    chroot: ""
    pidfile: "/run/unbound/unbound.pid"
    # No logfile: — /var/log is root-owned and unbound drops privileges to
    # the "unbound" user before it would open one itself, unlike the shell
    # redirection docker-init uses (opened as root, before the daemon
    # forks). Leaving both logfile and use-syslog unset sends output to
    # stderr instead, which docker-init already redirects to
    # /var/log/unbound.err.
    use-syslog: no
    verbosity: 1

    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    use-caps-for-id: yes
    qname-minimisation: yes

    prefetch: yes
    num-threads: 1
    msg-cache-size: 16m
    rrset-cache-size: 32m
